spring.application.name=market-cron

server.port=8082
server.servlet.context-path=/cron
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

jwt.token.header=Market-Auth
jwt.token.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1pcy1hLWRldi1vbmx5LWhtYWMtc2hhNTEyLXNlY3JldC1rZXktdmFsdWU=}
jwt.token.expiration=10800

springdoc.swagger-ui.path=/open-api-documentation
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true

management.endpoints.web.exposure.include=health,info

# aws
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket=${AWS_S3_BUCKET:market}
aws.s3.cloud-front-url=${AWS_S3_CDN_URL:https://files.market.mn/}

# payment
payment.qpay.url=${QPAY_URL:https://merchant.qpay.mn/v2}
payment.qpay.username=${QPAY_USERNAME:}
payment.qpay.password=${QPAY_PASSWORD:}
payment.qpay.invoice-code=${QPAY_INVOICE_CODE:}
payment.qpay.callback-url=${QPAY_CALLBACK_URL:http://localhost:8082/cron/v1/payment/callback/QPAY?paymentId=}

# cron expressions
cron.order-expiry=0 */5 * * * *
cron.payment-reconcile=0 */10 * * * *
cron.low-stock=0 0 8 * * *

# firebase auth (google / apple / phone otp)
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
